<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Events & Hackathons Hub — CampusConnect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#5341cd",
            "primary-hover": "#4532b8",
            "primary-container": "#6c5ce7",
            "on-primary": "#ffffff",
            "on-primary-container": "#faf6ff",
            secondary: "#0060a9",
            tertiary: "#006461",
            "tertiary-accent": "#00cec9",
            background: "#fbf8ff",
            surface: "#fbf8ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f2ff",
            "surface-container": "#eeecff",
            "surface-container-high": "#e7e6ff",
            "on-surface": "#171931",
            "on-surface-variant": "#474554",
            outline: "#787586",
            "outline-variant": "#c8c4d7",
            error: "#ba1a1a"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="bg-background text-on-surface antialiased font-body flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <header class="fixed top-0 left-0 w-full z-50 glass-nav shadow-sm">
    <div class="h-20 max-w-[1280px] mx-auto px-4 sm:px-6 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 sm:gap-6">
        <a href="/index.html" class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center text-white shadow-md shadow-primary/20">
            <span class="material-symbols-outlined text-[24px]">school</span>
          </div>
          <div>
            <span class="font-headline font-extrabold text-xl sm:text-2xl text-primary tracking-tight block">CampusConnect</span>
            <span class="text-[10px] text-gray-500 font-semibold tracking-wider uppercase block -mt-1">Events & Sprints</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a href="/index.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors">Home</a>
        <a href="/opportunities.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors">Opportunities</a>
        <a href="/campusfix.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors flex items-center gap-1.5">
          <span>CampusFix</span>
          <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-[#E6F8F4] text-[#00B894] text-[10px] font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-[#00B894] pulse-indicator"></span>Active
          </span>
        </a>
        <a href="/services.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors">Services</a>
        <a href="/events.html" class="px-3.5 py-2 rounded-xl bg-primary text-white font-semibold shadow-sm">Events & Hackathons</a>
      </nav>

      <div id="navbar-auth-section" class="flex items-center gap-2 sm:gap-3"></div>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main class="flex-1 pt-24 pb-16">
    <div class="max-w-[1280px] mx-auto px-4 sm:px-6 py-6">
      
      <!-- Top Title -->
      <div class="mb-8">
        <div class="flex items-center gap-2 text-xs font-semibold text-primary uppercase tracking-wider mb-1">
          <span class="material-symbols-outlined text-[16px]">emoji_events</span>
          <span>Inter & Intra Campus Arena</span>
        </div>
        <h1 class="font-headline text-2xl sm:text-3xl font-extrabold text-gray-900">Events, Hackathons & Placement Sprints</h1>
        <p class="text-xs sm:text-sm text-gray-500 mt-1">Compete for cash prize pools, mentorship grants, and placement readiness workshops.</p>
      </div>

      <!-- Events List -->
      <div id="events-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    async function loadEvents() {
      const container = document.getElementById('events-grid');
      try {
        const res = await API.get('/events');
        if (res.success && res.data) {
          container.innerHTML = res.data.map(evt => `
            <div class="bg-white rounded-3xl overflow-hidden border border-gray-100 shadow-sm card-hover flex flex-col justify-between">
              <div>
                <div class="h-44 w-full bg-surface-container overflow-hidden relative">
                  <img src="${evt.bannerImage}" class="w-full h-full object-cover">
                  <span class="absolute top-3 right-3 px-3 py-1 rounded-full text-xs font-bold bg-white/90 backdrop-blur-sm text-primary shadow-sm">
                    ${evt.category}
                  </span>
                </div>

                <div class="p-6">
                  <div class="flex items-center gap-2 text-xs font-semibold text-emerald-600 mb-1">
                    <span class="material-symbols-outlined text-[16px]">stars</span>
                    <span>Prize Pool: ${evt.prizePool}</span>
                  </div>

                  <h3 class="font-headline font-bold text-lg text-gray-900 leading-snug">${evt.title}</h3>
                  <p class="text-xs text-gray-500 mt-1">By ${evt.organizer}</p>

                  <div class="space-y-1.5 mt-4 text-xs text-gray-600 bg-surface-container-low p-3 rounded-2xl border border-gray-100">
                    <div class="flex items-center gap-2">
                      <span class="material-symbols-outlined text-[16px] text-primary">calendar_today</span>
                      <span>${evt.date} (${evt.time})</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="material-symbols-outlined text-[16px] text-primary">pin_drop</span>
                      <span>${evt.venue}</span>
                    </div>
                  </div>

                  <p class="text-xs text-gray-600 mt-4 line-clamp-3 leading-relaxed">${evt.description}</p>
                </div>
              </div>

              <div class="p-6 pt-0 border-t border-gray-100 mt-4 flex items-center justify-between">
                <div>
                  <span class="text-[10px] text-gray-400 font-bold uppercase">Registrations</span>
                  <p class="text-xs font-bold text-gray-700">${evt.teamsRegistered} Participants</p>
                </div>

                ${evt.isRegistered ? `
                  <span class="px-3 py-1.5 rounded-xl bg-emerald-50 text-[#00b894] text-xs font-bold flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">check_circle</span> Registered
                  </span>
                ` : `
                  <button onclick="registerForEvent('${evt.id}')" class="px-4 py-2 rounded-xl bg-primary text-white text-xs font-semibold hover:bg-primary-hover shadow-sm transition-all flex items-center gap-1">
                    <span>Register Now</span>
                    <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                  </button>
                `}
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to load events:', err);
      }
    }

    async function registerForEvent(eventId) {
      if (!Auth.isLoggedIn()) {
        Auth.openAuthModal('login');
        return;
      }
      try {
        const res = await API.post(`/events/${eventId}/register`);
        if (res.success) {
          Toast.success('Registered!', res.message);
          loadEvents();
        }
      } catch (err) {
        Toast.error('Registration Error', err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', loadEvents);
    window.onAuthChange = () => {
      loadEvents();
    };
  </script>
</body>
</html>
