<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Campus Services & Local Directory — CampusConnect</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#5341cd",
            "primary-hover": "#4532b8",
            "primary-container": "#6c5ce7",
            "on-primary": "#ffffff",
            "on-primary-container": "#faf6ff",
            secondary: "#0060a9",
            tertiary: "#006461",
            "tertiary-accent": "#00cec9",
            background: "#fbf8ff",
            surface: "#fbf8ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f4f2ff",
            "surface-container": "#eeecff",
            "surface-container-high": "#e7e6ff",
            "on-surface": "#171931",
            "on-surface-variant": "#474554",
            outline: "#787586",
            "outline-variant": "#c8c4d7",
            error: "#ba1a1a"
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/style.css"/>
</head>
<body class="bg-background text-on-surface antialiased font-body flex flex-col min-h-screen">

  <!-- NAVBAR -->
  <header class="fixed top-0 left-0 w-full z-50 glass-nav shadow-sm">
    <div class="h-20 max-w-[1280px] mx-auto px-4 sm:px-6 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 sm:gap-6">
        <a href="/index.html" class="flex items-center gap-2.5">
          <div class="w-10 h-10 rounded-2xl bg-primary flex items-center justify-center text-white shadow-md shadow-primary/20">
            <span class="material-symbols-outlined text-[24px]">school</span>
          </div>
          <div>
            <span class="font-headline font-extrabold text-xl sm:text-2xl text-primary tracking-tight block">CampusConnect</span>
            <span class="text-[10px] text-gray-500 font-semibold tracking-wider uppercase block -mt-1">Local Directory</span>
          </div>
        </a>
      </div>

      <nav class="hidden md:flex items-center gap-1 text-sm font-medium">
        <a href="/index.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors">Home</a>
        <a href="/opportunities.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors">Opportunities</a>
        <a href="/campusfix.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors flex items-center gap-1.5">
          <span>CampusFix</span>
          <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded-full bg-[#E6F8F4] text-[#00B894] text-[10px] font-bold">
            <span class="w-1.5 h-1.5 rounded-full bg-[#00B894] pulse-indicator"></span>Active
          </span>
        </a>
        <a href="/services.html" class="px-3.5 py-2 rounded-xl bg-primary text-white font-semibold shadow-sm">Services</a>
        <a href="/events.html" class="px-3.5 py-2 rounded-xl text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low transition-colors">Events & Hackathons</a>
      </nav>

      <div id="navbar-auth-section" class="flex items-center gap-2 sm:gap-3"></div>
    </div>
  </header>

  <!-- MAIN VIEW -->
  <main class="flex-1 pt-24 pb-16">
    <div class="max-w-[1280px] mx-auto px-4 sm:px-6 py-6">
      
      <!-- Top Title -->
      <div class="mb-8">
        <div class="flex items-center gap-2 text-xs font-semibold text-primary uppercase tracking-wider mb-1">
          <span class="material-symbols-outlined text-[16px]">storefront</span>
          <span>Verified Campus Clusters</span>
        </div>
        <h1 class="font-headline text-2xl sm:text-3xl font-extrabold text-gray-900">Campus Services & Student Discounts</h1>
        <p class="text-xs sm:text-sm text-gray-500 mt-1">High-speed printing, laptop repair, tiffin meals, and PGs with exclusive student pricing.</p>
      </div>

      <!-- Search & Filters -->
      <div class="bg-white rounded-2xl p-4 sm:p-5 border border-gray-100 shadow-sm mb-8 space-y-4">
        <div class="relative flex items-center w-full">
          <span class="material-symbols-outlined text-gray-400 text-[22px] absolute left-4">search</span>
          <input id="srv-search" oninput="debounceServicesSearch()" type="text" placeholder="Search printing, laptop repair, mess, or PG..." class="w-full pl-12 pr-4 py-2.5 rounded-xl bg-surface-container-low border border-transparent focus:border-primary/30 focus:bg-white text-sm text-gray-900 focus:outline-none">
        </div>

        <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-gray-100 text-xs">
          <button onclick="setServiceFilter('category', 'All')" class="srv-cat-btn px-3 py-1.5 rounded-full bg-primary text-white font-semibold">All Services</button>
          <button onclick="setServiceFilter('category', 'Printing & Stationery')" class="srv-cat-btn px-3 py-1.5 rounded-full bg-surface-container-low text-gray-600 hover:bg-surface-container">Printing & Thesis</button>
          <button onclick="setServiceFilter('category', 'Food & Tiffin')" class="srv-cat-btn px-3 py-1.5 rounded-full bg-surface-container-low text-gray-600 hover:bg-surface-container">Food & Tiffin</button>
          <button onclick="setServiceFilter('category', 'Laptop & Electronics Repair')" class="srv-cat-btn px-3 py-1.5 rounded-full bg-surface-container-low text-gray-600 hover:bg-surface-container">Laptop Repair</button>
          <button onclick="setServiceFilter('category', 'PG & Accommodation')" class="srv-cat-btn px-3 py-1.5 rounded-full bg-surface-container-low text-gray-600 hover:bg-surface-container">Hostel & PG</button>
        </div>
      </div>

      <!-- Services Grid -->
      <div id="services-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    let serviceFilters = { search: '', category: 'All' };
    let srvTimer = null;

    function debounceServicesSearch() {
      clearTimeout(srvTimer);
      srvTimer = setTimeout(() => {
        serviceFilters.search = document.getElementById('srv-search').value.trim();
        loadServices();
      }, 300);
    }

    function setServiceFilter(key, val) {
      serviceFilters[key] = val;
      document.querySelectorAll('.srv-cat-btn').forEach(btn => {
        if (btn.textContent.trim().toLowerCase().includes(val.toLowerCase()) || (val === 'All' && btn.textContent.trim() === 'All Services')) {
          btn.className = 'srv-cat-btn px-3 py-1.5 rounded-full bg-primary text-white font-semibold';
        } else {
          btn.className = 'srv-cat-btn px-3 py-1.5 rounded-full bg-surface-container-low text-gray-600 hover:bg-surface-container';
        }
      });
      loadServices();
    }

    async function loadServices() {
      const container = document.getElementById('services-grid');
      try {
        const res = await API.get('/services', serviceFilters);
        if (res.success && res.data) {
          container.innerHTML = res.data.map(srv => `
            <div class="bg-white rounded-3xl p-6 border border-gray-100 shadow-sm card-hover flex flex-col sm:flex-row gap-5 items-start justify-between">
              <div class="w-full sm:w-36 h-36 rounded-2xl overflow-hidden bg-surface-container flex-shrink-0">
                <img src="${srv.image}" class="w-full h-full object-cover">
              </div>

              <div class="flex-1 flex flex-col justify-between h-full">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-1">
                    <span class="text-[11px] font-bold text-primary uppercase">${srv.category}</span>
                    <span class="flex items-center gap-1 text-xs font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full">
                      ★ ${srv.rating} (${srv.reviewsCount})
                    </span>
                  </div>

                  <h3 class="font-headline font-bold text-base text-gray-900 leading-snug">${srv.name}</h3>
                  
                  <div class="flex items-center gap-1 text-xs text-gray-500 mt-1">
                    <span class="material-symbols-outlined text-[16px] text-gray-400">directions_walk</span>
                    <span>${srv.distance}</span>
                    <span class="text-gray-300 mx-1">•</span>
                    <span>${srv.hours}</span>
                  </div>

                  <div class="mt-2.5 inline-block px-2.5 py-1 rounded-xl bg-emerald-50 text-[#00b894] text-xs font-bold border border-emerald-100">
                    🏷️ ${srv.discountBadge}
                  </div>

                  <p class="text-xs text-gray-600 mt-2.5 leading-relaxed">${srv.description}</p>
                </div>

                <div class="mt-4 pt-3 border-t border-gray-100 flex items-center gap-3">
                  <a href="https://wa.me/${srv.whatsapp}?text=Hi!%20I%20found%20you%20on%20CampusConnect%20Portal" target="_blank" class="px-3.5 py-1.5 rounded-xl bg-[#25D366] text-white text-xs font-semibold hover:opacity-90 flex items-center gap-1 shadow-sm">
                    <span>WhatsApp</span>
                  </a>
                  <a href="tel:${srv.phone}" class="px-3.5 py-1.5 rounded-xl bg-surface-container-low hover:bg-surface-container text-gray-700 text-xs font-semibold flex items-center gap-1">
                    <span class="material-symbols-outlined text-[14px]">call</span>
                    <span>${srv.phone}</span>
                  </a>
                </div>
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        console.error('Failed to load services:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadServices);
  </script>
</body>
</html>
